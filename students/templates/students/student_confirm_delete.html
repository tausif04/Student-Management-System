{% extends "base.html" %}

{% block title %}Delete Student | StudentMS{% endblock %}

{% block content %}
<section class="form-page">
    <div class="card confirmation-card">
        <div class="warning-icon">!</div>
        <p class="eyebrow">Delete Record</p>
        <h1>Delete {{ object.name }}?</h1>
        <p>
            This action will permanently remove the student record.
            This cannot be undone.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="form-actions centered">
                <a class="button button-secondary" href="{% url 'students:detail' object.pk %}">Cancel</a>
                <button class="button button-danger" type="submit">Yes, Delete</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
